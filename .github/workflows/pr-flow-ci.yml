name: PR Flow CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kiểm tra cấu trúc notebook và build trang thử nghiệm
        run: |
          python pr-flow-lab/check_notebooks.py
          python pr-flow-lab/build_site.py
          python -m unittest discover -s pr-flow-lab -p 'test_*.py' -v
